<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftLegends Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-brand"><img src="logo-craftlegends-main.png" alt="CraftLegends">CraftLegends</a>
  <div class="nav-links">
    <a href="index.html#server">Server</a>
    <a href="mitglieder.html">Mitglieder</a>
    <a href="regeln.html">Regeln</a>
    <a href="ankuendigungen.html">Ankündigungen</a>
    <a href="flappy.html">Flappy Bird</a>
  </div>
</nav>

<div class="hero hero-small" id="server-hero">Lädt…</div>
<div class="wrap" id="banner-wrap" style="display:none;"><div class="discontinued-banner" id="banner"></div></div>
<section>
  <h2>📸 Bilder</h2>
  <div class="gallery" id="gallery"></div>
  <div class="action-row" id="actions"></div>
</section>

<dialog id="ip-dialog" class="ip-dialog">
  <button class="dlg-x" onclick="this.closest('dialog').close()">✕</button>
  <div class="ip-dialog-content">
    <div class="ip-label">Server-IP</div><div class="ip-big" id="ip-value"></div>
    <div class="ip-label">Version</div><div class="version-big" id="version-value"></div>
    <p class="ip-note" id="ip-note"></p>
  </div>
</dialog>
<dialog id="info-dialog" class="ip-dialog">
  <button class="dlg-x" onclick="this.closest('dialog').close()">✕</button>
  <div class="ip-dialog-content" style="text-align:left;"><p id="info-text" style="line-height:1.7;margin:0;"></p></div>
</dialog>
<div class="lightbox" id="lb" hidden>
  <button class="lb-x" id="lb-x" aria-label="Schließen">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="Zurück">‹</button>
  <img id="lb-img" alt="">
  <button class="lb-nav lb-next" id="lb-next" aria-label="Weiter">›</button>
  <div class="lb-count" id="lb-count"></div>
</div>
<footer id="foot">CraftLegends</footer>

<script>
const id=new URLSearchParams(location.search).get('id');
/* Galerie-Daten robust einlesen (Liste, verschachtelte Listen, Objekte oder Komma-Text) */
function flatPics(v){
  if(Array.isArray(v))return v.flatMap(flatPics);
  if(v&&typeof v==='object')return flatPics(Object.values(v));
  if(typeof v==='string'){
    return v.split(/,\s*(?=\/?[^,]+\.(?:png|jpe?g|webp|gif|avif))/i).map(x=>x.trim()).filter(Boolean);
  }
  return [];
}
/* Lightbox: ein Bild groß, mit Pfeilen / Tastatur / Wischen durchblättern */
let LB={list:[],i:0};
function showLb(){
  document.getElementById('lb-img').src=LB.list[LB.i];
  document.getElementById('lb-count').textContent=(LB.i+1)+' / '+LB.list.length;
  const many=LB.list.length>1;
  document.getElementById('lb-prev').style.display=many?'':'none';
  document.getElementById('lb-next').style.display=many?'':'none';
}
function openLb(list,i){LB={list,i};showLb();document.getElementById('lb').hidden=false;}
function closeLb(){document.getElementById('lb').hidden=true;}
function stepLb(d){LB.i=(LB.i+d+LB.list.length)%LB.list.length;showLb();}
document.getElementById('lb-x').onclick=closeLb;
document.getElementById('lb-prev').onclick=()=>stepLb(-1);
document.getElementById('lb-next').onclick=()=>stepLb(1);
document.getElementById('lb').addEventListener('click',e=>{if(e.target.id==='lb')closeLb();});
document.addEventListener('keydown',e=>{
  if(document.getElementById('lb').hidden)return;
  if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')stepLb(-1);if(e.key==='ArrowRight')stepLb(1);
});
let tx=null;
document.getElementById('lb').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('lb').addEventListener('touchend',e=>{
  if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;
  if(Math.abs(dx)>50&&LB.list.length>1)stepLb(dx<0?1:-1);
});

fetch('data-servers.json').then(r=>r.json()).then(data=>{
  const s=(data.servers||data).find(x=>x.id===id);
  if(!s){document.getElementById('server-hero').innerHTML='<h1>Server nicht gefunden</h1><p class="lead">Bitte über die <a href="index.html">Startseite</a> einen Server auswählen.</p>';return;}
  document.title=s.name+' — CraftLegends'; document.getElementById('foot').textContent=s.name;
  const live=s.status==='live';
  document.getElementById('server-hero').innerHTML=`
    ${s.logo?`<img class="server-logo" src="${s.logo}" alt="${s.name}">`:''}
    <div class="server-hero"><h1 style="color:${s.color||'var(--emerald)'};">${s.name.toUpperCase()}</h1>
    <span class="status-badge ${live?'status-live':'status-archived'}">${live?'LIVE':'ARCHIV'}</span></div>
    <p class="server-desc">${s.description||''}</p>`;
  if(s.discontinued_note){document.getElementById('banner-wrap').style.display='block';document.getElementById('banner').textContent='⚠️ '+s.discontinued_note;}
  const g=document.getElementById('gallery');
  const pics=flatPics(s.gallery);
  if(pics.length){
    g.innerHTML=pics.map((p,i)=>`<img src="${p}" alt="${s.name} Bild ${i+1}" data-i="${i}" loading="lazy">`).join('');
    g.querySelectorAll('img').forEach(im=>im.addEventListener('click',()=>openLb(pics,+im.dataset.i)));
  }else{
    g.innerHTML='<div class="placeholder">Bild folgt</div><div class="placeholder">Bild folgt</div><div class="placeholder">Bild folgt</div>';
  }
  const stats=s.stats_url?`<a class="action-btn" href="${s.stats_url}">📊 Server Stats</a>`:`<button class="action-btn" id="nostats">📊 Server Stats</button>`;
  let world='';
  if(!live){world=s.world_download?`<a class="action-btn" href="${s.world_download}" target="_blank" rel="noopener">🌍 World Download</a>`:`<button class="action-btn" id="noworld">🌍 World Download</button>`;}
  document.getElementById('actions').innerHTML=`<button class="action-btn" id="ipbtn">🌐 Server IP / Version</button>${stats}${world}`;
  const info=t=>{document.getElementById('info-text').textContent=t;document.getElementById('info-dialog').showModal();};
  document.getElementById('ipbtn').onclick=()=>{
    document.getElementById('ip-value').textContent=s.ip||'noch keine IP hinterlegt';
    document.getElementById('version-value').textContent=s.version||'unbekannt';
    const n=document.getElementById('ip-note');n.textContent=s.ip_note||'';n.style.display=s.ip_note?'block':'none';
    document.getElementById('ip-dialog').showModal();};
  const ns=document.getElementById('nostats'); if(ns)ns.onclick=()=>info(s.no_stats_note||'Für diesen Server sind aktuell keine Statistiken verfügbar.');
  const nw=document.getElementById('noworld'); if(nw)nw.onclick=()=>info(s.discontinued_note||'Für diesen Server steht aktuell kein World-Download bereit.');
});
</script>
</body>
</html>
