<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftLegends Server</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand"><img src="logo-craftlegends-main.svg" alt="CraftLegends Logo" style="height:28px; vertical-align:middle; margin-right:8px;">CraftLegends</a>
  <div class="nav-links">
    <a href="index.html#server">Server</a>
    <a href="mitglieder.html">Mitglieder</a>
    <a href="regeln.html">Regeln</a>
    <a href="ankuendigungen.html">Ankündigungen</a>
    <a href="flappy.html">Flappy Bird</a>
  </div>
</nav>

<div class="hero hero-small" id="server-hero">Lädt…</div>

<section>
  <h2>📸 Bilder</h2>
  <div class="gallery" id="server-gallery"></div>
  <div class="action-row" id="server-actions"></div>
</section>

<dialog id="ip-dialog" class="ip-dialog">
  <button class="dialog-close" onclick="document.getElementById('ip-dialog').close()">✕</button>
  <div class="ip-dialog-content">
    <div class="ip-label">Server-IP</div>
    <div class="ip-big" id="ip-value"></div>
    <div class="ip-label">Version</div>
    <div class="version-big" id="version-value"></div>
    <p class="ip-note" id="ip-note-value"></p>
  </div>
</dialog>

<footer id="server-footer">CraftLegends</footer>

<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');

fetch('data-servers.json').then(r => r.json()).then(data => {
  const servers = data.servers || data;
  const s = servers.find(sv => sv.id === id);
  if (!s) {
    document.getElementById('server-hero').innerHTML = '<h1>Server nicht gefunden</h1><p class="lead">Bitte über die <a href="index.html">Startseite</a> einen Server auswählen.</p>';
    return;
  }
  document.title = s.name + ' — CraftLegends';
  document.getElementById('server-footer').textContent = s.name;

  const statusLabel = s.status === 'live' ? 'LIVE' : 'ARCHIV';
  const statusCls = s.status === 'live' ? 'status-live' : 'status-archived';

  document.getElementById('server-hero').innerHTML = `
    ${s.logo ? `<img class="server-logo" src="${s.logo}" alt="${s.name} Logo">` : ''}
    <div class="server-hero">
      <h1 style="color: ${s.color || 'var(--emerald)'};">${s.name.toUpperCase()}</h1>
      <span class="status-badge ${statusCls}">${statusLabel}</span>
    </div>
    <p class="server-desc">${s.description || ''}</p>
  `;

  const gallery = document.getElementById('server-gallery');
  if (s.gallery && s.gallery.length) {
    gallery.innerHTML = s.gallery.map(img => `<img src="${img}" alt="${s.name} Bild">`).join('');
  } else {
    gallery.innerHTML = '<div class="placeholder">Bild folgt</div><div class="placeholder">Bild folgt</div><div class="placeholder">Bild folgt</div>';
  }

  const statsBtn = s.stats_url
    ? `<a class="action-btn" href="${s.stats_url}">📊 Server Stats</a>`
    : `<span class="action-btn disabled">📊 Server Stats (nicht verfügbar)</span>`;

  // World Download nur anzeigen, wenn der Server nicht mehr laeuft
  let worldBtn = '';
  if (s.status !== 'live') {
    worldBtn = s.world_download
      ? `<a class="action-btn" href="${s.world_download}" download>🌍 World Download</a>`
      : `<span class="action-btn disabled">🌍 World Download (folgt)</span>`;
  }

  document.getElementById('server-actions').innerHTML = `
    <button class="action-btn" id="ip-btn" style="font: inherit; cursor:pointer;">🌐 Server IP / Version</button>
    ${statsBtn}
    ${worldBtn}
  `;
  document.getElementById('ip-btn').addEventListener('click', () => {
    document.getElementById('ip-value').textContent = s.ip || 'noch keine IP hinterlegt';
    document.getElementById('version-value').textContent = s.version || 'unbekannt';
    const noteEl = document.getElementById('ip-note-value');
    noteEl.textContent = s.ip_note || '';
    noteEl.style.display = s.ip_note ? 'block' : 'none';
    document.getElementById('ip-dialog').showModal();
  });
});
</script>

</body>
</html>
