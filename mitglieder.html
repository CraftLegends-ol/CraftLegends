<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mitglieder — CraftLegends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-brand">⛏️ CraftLegends</a>
  <div class="nav-links">
    <a href="index.html#server">Server</a>
    <a href="mitglieder.html" class="active">Mitglieder</a>
  </div>
</nav>

<div class="hero hero-small">
  <h1>MITGLIEDER</h1>
  <p class="lead">Alle Spieler von CraftLegends auf einen Blick — mit Rolle und Team-Zugehörigkeit.</p>
</div>

<section>
  <div class="members-grid" id="members-grid">Lädt…</div>
</section>

<footer>CraftLegends</footer>

<script>
fetch('data-members.json').then(r => r.json()).then(data => {
  const grid = document.getElementById('members-grid');
  grid.innerHTML = data.members.map(m => {
    const roleCls = m.role === 'Admin' ? 'role-admin' : m.role === 'Developer' ? 'role-dev' : m.role === 'Operator' ? 'role-op' : 'role-member';
    const team = data.teams[m.team];
    const teamBadge = team
      ? `<span class="team-badge" style="color:${team.color}; background:${team.color}22; border-color:${team.color}55">${team.label}</span>`
      : `<span class="team-badge team-none">MBR</span>`;
    return `
      <div class="member-card">
        <img class="member-head" src="https://mc-heads.net/avatar/${encodeURIComponent(m.name)}/96" alt="${m.name}" loading="lazy"
             onerror="this.src='https://crafatar.com/avatars/${m.uuid}?size=96&overlay'">
        <div class="member-name">${m.name}</div>
        <div class="member-badges">
          <span class="role-badge ${roleCls}">${m.role}</span>
          ${teamBadge}
        </div>
      </div>`;
  }).join('');
});
</script>
</body>
</html>
