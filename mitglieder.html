<script>
const pdlg=document.getElementById('pdlg');
let MEM=null, COMB=null, CUR=null, CURN=null;
const fmt=n=>Math.round(n).toLocaleString('de-DE');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Skins immer über die UUID laden (bleibt auch nach einer Namensänderung gleich).
   Falls ein Dienst nicht antwortet, wird automatisch der nächste probiert. */
function skinSources(m){
  const key=(m.skin||'').trim();
  if(m.skin_image)return [m.skin_image];                 // eigenes Kopf-Bild hat Vorrang
  if(/^https?:\/\//i.test(key))return [key];             // direkter Bild-Link
  const asUuid=k=>/^[0-9a-f]{32}$/i.test(k.replace(/-/g,''));
  if(key&&!asUuid(key)){                                 // Name angegeben -> über den Namen laden
    const n=encodeURIComponent(key);
    return [`https://mc-heads.net/avatar/${n}/96`,`https://minotar.net/helm/${n}/96.png`];
  }
  const u=(key||m.uuid||'').replace(/-/g,'');            // sonst über die UUID (Standard)
  return [
    `https://mc-heads.net/avatar/${u}/96`,
    `https://crafatar.com/avatars/${u}?size=96&overlay`,
    `https://minotar.net/helm/${u}/96.png`,
    `https://mc-heads.net/avatar/${encodeURIComponent(m.name)}/96`
  ];
}
function skinNext(img){
  const s=JSON.parse(img.dataset.srcs),i=(+img.dataset.i||0)+1;
  if(i<s.length){img.dataset.i=i;img.src=s[i];}
}
function headImg(m){
  const s=skinSources(m);
  return `<img class="member-head" src="${s[0]}" data-srcs='${JSON.stringify(s)}' data-i="0" alt="${esc(m.name)}" loading="lazy" onerror="skinNext(this)">`;
}
const ROLE_CLS={Admin:'role-admin',Moderator:'role-mod',Developer:'role-dev',Operator:'role-op',Member:'role-member',Ehemalig:'role-former'};
function roleBadges(m){
  return [m.role,m.extra_role].filter(Boolean).map(r=>`<span class="role-badge ${ROLE_CLS[r]||'role-member'}">${esc(r)}</span>`).join('');
}
function card(m){
  const team=MEM.teams[m.team];
  const tb=m.role==='Ehemalig'?'':team?`<span class="team-badge" style="color:${team.color};background:${team.bg||team.color+'22'};border-color:${team.color}55">${team.label}</span>`:`<span class="team-badge team-none">MBR</span>`;
  const has=COMB.players[m.uuid];
  const inner=`${headImg(m)}<div class="member-name">${esc(m.name)}</div><div class="member-badges">${roleBadges(m)}${tb}</div>
    <div class="member-hint">${has?(m.note?esc(m.note)+' · Stats ansehen':'Stats ansehen'):'noch keine Daten'}</div>`;
  return has?`<button class="member-card" data-u="${esc(m.uuid)}" data-n="${esc(m.name)}">${inner}</button>`:`<div class="member-card nodata">${inner}</div>`;
}
function ring(p,size=72,st=8){
  const r=(size-st)/2,c=2*Math.PI*r,off=c*(1-p/100),col=p>=75?'var(--emerald)':p>=40?'var(--gold)':'var(--redstone)';
  return `<span class="ringwrap"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--card-border)" stroke-width="${st}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${st}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><span class="rlabel">${p}%</span></span>`;
}
const kv=rows=>'<ul class="kv">'+rows.map(([l,v])=>`<li><span>${esc(l)}</span><b>${v}</b></li>`).join('')+'</ul>';
const pill=(i,l,v)=>`<div class="pill"><span>${i}</span><b>${v}</b><span class="d">${l}</span></div>`;

function showStats(u){
  const r=COMB.players[u];
  const per=Object.entries(r.per_server).filter(([,v])=>v).map(([s,v])=>`${s}: ${v.play_hours} h · ${fmt(v.blocks_mined)} abgebaut`).join(' &nbsp;|&nbsp; ');
  let h=`<p class="srv-line">Zusammengerechnet aus: ${r.servers.join(' + ')}</p><p class="srv-line">${per}</p><div class="pills">`+
    pill('⏱️','Spielzeit',r.play_hours+' h')+pill('⛏️','Abgebaut',fmt(r.blocks_mined))+pill('🧱','Platziert',fmt(r.blocks_placed))+
    pill('💀','Tode',fmt(r.deaths))+pill('⚔️','Spieler-Kills',fmt(r.player_kills))+pill('👹','Mobs',fmt(r.mob_kills_total))+
    pill('🤝','Handel',fmt(r.trades))+pill('🍗','Essen',fmt(r.total_food))+pill('🪬','Gepoppte Totems',fmt(r.totems))+pill('💥','Schaden ausgeteilt',fmt(r.damage_dealt)+' ♥')+pill('🩸','Schaden genommen',fmt(r.damage_taken)+' ♥')+pill('📖','Verzaubert',fmt(r.enchanted))+pill('🎣','Geangelt',fmt(r.fished))+pill('🛠️','Gecraftet',fmt(r.crafted_total))+pill('📤','Gedroppt',fmt(r.dropped_total))+pill('📥','Aufgesammelt',fmt(r.picked_up_total))+
    pill('🚶','Strecke',fmt(r.total_distance_blocks)+' Blöcke')+pill('⭐','Höchstes Level',r.level)+`</div><div class="cols">`;
  const mv=Object.entries(r.movement_blocks).sort((a,b)=>b[1]-a[1]).map(([k,v])=>[k,fmt(v)]);
  if(mv.length)h+=`<div><h4>🚶 Strecke</h4>${kv(mv)}</div>`;
  const tl=Object.entries(r.tool_usage).map(([k,v])=>[k,fmt(v)]);
  if(tl.length)h+=`<div><h4>🛠️ Werkzeuge &amp; Waffen</h4>${kv(tl)}</div>`;
  const fd=Object.entries(r.food_eaten).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>[k,fmt(v)]);
  if(fd.length)h+=`<div><h4>🍗 Essen (Top 10)</h4>${kv(fd)}</div>`;
  const mb=Object.entries(r.mob_kills_breakdown).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>[k,fmt(v)]);
  if(mb.length)h+=`<div><h4>👹 Getötete Mobs (Top 10)</h4>${kv(mb)}</div>`;
  document.getElementById('pbody').innerHTML=h+'</div>';
}
function showAdv(u){
  const r=COMB.players[u], done=new Set(r.achievements_done);
  let h=`<div class="ring-row">${ring(r.achievements_pct)}<div><b>${r.achievements_count} von ${r.achievements_total}</b> Fortschritten<br><span class="srv-line">über alle Server zusammengerechnet</span></div></div>`;
  for(const cat of Object.keys(COMB.category_labels)){
    const items=COMB.master.filter(m=>m.category===cat); if(!items.length)continue;
    const got=items.filter(m=>done.has(m.id)).length;
    h+=`<div class="grp"><h4>${COMB.category_icons[cat]} ${COMB.category_labels[cat]}<span>${got}/${items.length}</span></h4><ul class="al">`+
      items.map(m=>`<li class="${done.has(m.id)?'':'no'}"><span>${done.has(m.id)?'✅':'🔒'}</span><span>${m.title}</span></li>`).join('')+'</ul></div>';
  }
  document.getElementById('pbody').innerHTML=h;
}
function open_(u,n,tab){
  CUR=u; CURN=n; document.getElementById('pname').textContent=n;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===tab));
  tab==='adv'?showAdv(u):showStats(u);
  if(!pdlg.open)pdlg.showModal();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>open_(CUR,CURN,t.dataset.t)));

fetch('data-members.json').then(r=>r.json()).then(mem=>{
  const comb=COMB_DATA;
  MEM=mem; COMB=comb;
  /* Spieler mit bekanntem Namen, die NICHT in der Mitgliederliste stehen, erscheinen automatisch als "Ehemalige" */
  const known=new Set(mem.members.map(x=>x.uuid));
  const former={members:Object.entries(comb.players).filter(([u,p])=>p.known_name&&!known.has(u))
    .map(([u,p])=>({name:p.known_name,uuid:u,role:'Ehemalig',team:'',note:'nur auf '+p.servers.join(' + ')}))
    .sort((x,y)=>x.name.localeCompare(y.name))};
  const grid=ms=>`<div class="members-grid">${ms.map(card).join('')}</div>`;
  const MG=['Admin','Moderator','Developer'];
  const isMg=m=>MG.includes(m.role)||MG.includes(m.extra_role);
  const rank=m=>Math.min(...[m.role,m.extra_role].filter(r=>MG.includes(r)).map(r=>MG.indexOf(r)));
  const mgmt=mem.members.filter(isMg).sort((x,y)=>rank(x)-rank(y));
  const rest=mem.members.filter(m=>!isMg(m));
  let h='';
  if(mgmt.length)h+=`<div class="member-group"><h2>🛡️ Management</h2>${grid(mgmt)}</div>`;
  if(rest.length){
    h+='<div class="member-group"><h2>👥 Member</h2>';
    Object.keys(mem.teams).forEach(tid=>{const g=rest.filter(m=>m.team===tid); if(!g.length)return;
      const t=mem.teams[tid]; h+=`<h3 class="team-subheading" style="color:${t.color==='#1a1a1a'?'var(--text)':t.color}">${t.label} Team</h3>${grid(g)}`;});
    const nt=rest.filter(m=>!m.team||!mem.teams[m.team]); if(nt.length)h+=`<h3 class="team-subheading">Ohne Team</h3>${grid(nt)}`;
    h+='</div>';
  }
  if((former.members||[]).length)h+=`<div class="member-group"><h2>📜 Ehemalige Spieler</h2><p class="srv-line" style="margin:-6px 0 14px">Haben auf CraftLegends 3 gespielt, sind auf CraftLegends 4 aber nicht dabei.</p>${grid(former.members)}</div>`;
  const root=document.getElementById('members-sections'); root.innerHTML=h;
  root.querySelectorAll('button.member-card').forEach(b=>b.addEventListener('click',()=>open_(b.dataset.u,b.dataset.n,'stats')));
});
