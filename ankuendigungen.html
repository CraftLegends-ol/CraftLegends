<div class="hero hero-small"><h1>ANKÜNDIGUNGEN</h1></div>
<section><div id="list">Lädt…</div></section>
<footer>CraftLegends</footer>
<script>
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
fetch('data-ankuendigungen.json').then(r=>r.json()).then(d=>{
  const l=(d.announcements||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  document.getElementById('list').innerHTML=l.map(a=>`<div class="announcement-card"><div class="announcement-date">${esc(String(a.date||'').slice(0,10))}</div><h3>${esc(a.title)}</h3><p>${esc(a.text)}</p></div>`).join('')||'<p class="lead">Noch keine Ankündigungen.</p>';
});
</script>
</body>
</html>
