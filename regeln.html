<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regeln — CraftLegends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-brand"><img src="logo-craftlegends-main.png" alt="CraftLegends">CraftLegends</a>
  <div class="nav-links">
    <a href="index.html#server">Server</a>
    <a href="mitglieder.html">Mitglieder</a>
    <a href="regeln.html" class="active">Regeln</a>
    <a href="ankuendigungen.html">Ankündigungen</a>
    <a href="flappy.html">Flappy Bird</a>
  </div>
</nav>

<div class="hero hero-small"><p class="lead" id="intro" style="display:none;"></p></div>
<section><div class="rules-text" id="rules">Lädt…</div></section>
<footer>CraftLegends</footer>
<script>
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
fetch('data-regeln.json').then(r=>r.json()).then(d=>{
  if(d.intro){const i=document.getElementById('intro');i.textContent=d.intro;i.style.display='block';}
  const html=(d.content||'').split(/\n\s*\n/).map(b=>{
    const t=b.trim(); if(!t)return '';
    if(t.startsWith('§')){const i=t.indexOf('\n');const title=i<0?t:t.slice(0,i);const rest=i<0?'':t.slice(i+1).trim();
      return `<div class="rule-item"><h3>${esc(title)}</h3>${rest?`<p>${esc(rest)}</p>`:''}</div>`;}
    if(!t.includes('\n')&&t.length<=45)return `<h2 class="rules-heading">${esc(t)}</h2>`;
    const lines=t.split('\n');
    if(lines.length>1&&lines[0].length<=45&&!/[.!:]$/.test(lines[0]))return `<h2 class="rules-heading">${esc(lines[0])}</h2><p class="rules-p">${esc(lines.slice(1).join('\n')).replace(/\n/g,'<br>')}</p>`;
    return `<p class="rules-p">${esc(t).replace(/\n/g,'<br>')}</p>`;
  }).join('');
  document.getElementById('rules').innerHTML=html;
});
</script>
</body>
</html>
