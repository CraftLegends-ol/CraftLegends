<div class="hero hero-small">
  <h1 id="regeln-title">REGELN</h1>
  <p class="lead" id="regeln-intro">Lädt…</p>
</div>

<section>
  <ol class="rules-list" id="rules-list"></ol>
</section>

<footer>CraftLegends</footer>

<script>
fetch('data-regeln.json').then(r => r.json()).then(data => {
  document.getElementById('regeln-title').textContent = data.title.toUpperCase();
  document.getElementById('regeln-intro').textContent = data.intro || '';
  document.getElementById('rules-list').innerHTML = (data.rules || []).map(r => `<li>${r}</li>`).join('');
});
</script>
</body>
