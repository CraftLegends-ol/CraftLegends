<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftLegends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand">⛏️ CraftLegends</a>
  <div class="nav-links">
    <a href="#server">Server</a>
    <a href="mitglieder.html">Mitglieder</a>
  </div>
</nav>

<div class="hero">
  <h1 id="site-title">CRAFTLEGENDS</h1>
  <p class="lead" id="site-description">Lädt…</p>
</div>

<section id="server">
  <h2>🗺️ Unsere Server</h2>
  <div class="server-grid" id="server-grid">Lädt…</div>
</section>

<section>
  <h2>👥 Community</h2>
  <a class="server-card" href="mitglieder.html" style="max-width:320px;">
    <h3>Mitglieder ansehen</h3>
    <p>Alle Spieler, Rollen &amp; Teams von CraftLegends.</p>
  </a>
</section>

<footer>CraftLegends</footer>

<script>
fetch('data-site.json').then(r => r.json()).then(site => {
  document.getElementById('site-title').textContent = site.title.toUpperCase();
  document.getElementById('site-description').textContent = site.description;
});

fetch('data-servers.json').then(r => r.json()).then(servers => {
  servers.sort((a, b) => b.number - a.number);
  const grid = document.getElementById('server-grid');
  grid.innerHTML = servers.map(s => `
    <a class="server-card" href="server.html?id=${encodeURIComponent(s.id)}">
      <span class="tag">${s.status === 'live' ? 'AKTUELL' : 'ARCHIV'}</span>
      <h3>${s.name}</h3>
      <p>${s.description ? s.description.slice(0, 90) + (s.description.length > 90 ? '…' : '') : ''}</p>
    </a>
  `).join('');
});
</script>

</body>
</html>
