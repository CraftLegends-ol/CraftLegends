backend:
  name: git-gateway
  branch: main

media_folder: "img"
public_folder: "/img"

collections:
  - name: "site"
    label: "Startseite"
    files:
      - file: "data-site.json"
        label: "Startseiten-Inhalt"
        name: "site"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Beschreibungstext", name: "description", widget: "text" }

  - name: "servers"
    label: "Server"
    files:
      - file: "data-servers.json"
        label: "Alle Server"
        name: "servers"
        fields:
          - label: "Server-Liste"
            name: "servers"
            widget: "list"
            summary: "{{fields.name}} ({{fields.status}})"
            fields:
              - { label: "ID (z.B. craftlegends-5, keine Leerzeichen)", name: "id", widget: "string" }
              - { label: "Nummer", name: "number", widget: "number" }
              - { label: "Name", name: "name", widget: "string" }
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["live", "archiv"]
              - { label: "Farbe (Hex, z.B. #35c97a)", name: "color", widget: "color" }
              - { label: "Logo", name: "logo", widget: "image", required: false, hint: "Bilddatei per Drag & Drop reinziehen oder klicken zum Auswählen" }
              - { label: "Beschreibung", name: "description", widget: "text" }
              - { label: "Server-IP", name: "ip", widget: "string", required: false }
              - { label: "Version", name: "version", widget: "string", required: false }
              - { label: "Hinweis zur IP (optional)", name: "ip_note", widget: "string", required: false }
              - { label: "Statistik-Seite (HTML-Datei)", name: "stats_url", widget: "file", required: false, hint: "Stats-HTML-Datei per Drag & Drop reinziehen. Leer lassen, wenn es keine Stats gibt." }
              - { label: "World Download – externer Link (optional)", name: "world_download", widget: "string", required: false, hint: "Weltdateien sind zu groß fürs Admin-Panel (GitHub erlaubt keine Dateien über 100 MB). ZIP z.B. bei Google Drive oder MEGA hochladen, Freigabe auf 'Jeder mit Link' stellen und den Link hier einfügen. Wird nur bei Servern mit Status 'archiv' angezeigt." }
              - { label: "Hinweis, warum der Server nicht mehr spielbar ist (optional)", name: "discontinued_note", widget: "text", required: false, hint: "Wird als rotes Banner auf der Serverseite angezeigt, z.B. wenn Weltdateien gelöscht wurden." }
              - { label: "Text beim Klick auf 'Server Stats', falls keine Stats vorhanden (optional)", name: "no_stats_note", widget: "text", required: false }
              - label: "Bildergalerie"
                name: "gallery"
                widget: "list"
                field: { label: "Bild", name: "image", widget: "image" }
                required: false

  - name: "members"
    label: "Mitglieder"
    files:
      - file: "data-members.json"
        label: "Mitglieder & Teams"
        name: "members"
        fields:
          - label: "Mitglieder-Liste"
            name: "members"
            widget: "list"
            summary: "{{fields.name}} ({{fields.role}})"
            fields:
              - { label: "Name (aktueller Minecraft-Name)", name: "name", widget: "string" }
              - { label: "Minecraft-UUID", name: "uuid", widget: "string" }
              - label: "Rolle"
                name: "role"
                widget: "select"
                options: ["Admin", "Moderator", "Developer", "Operator", "Member"]
              - label: "Zusatzrolle (optional)"
                name: "extra_role"
                widget: "select"
                options: ["Admin", "Moderator", "Developer", "Operator"]
                required: false
              - { label: "Team-Kürzel (leer lassen wenn kein Team)", name: "team", widget: "string", required: false }

  - name: "regeln"
    label: "Regeln"
    files:
      - file: "data-regeln.json"
        label: "Regeln-Seite"
        name: "regeln"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Einleitungstext (optional)", name: "intro", widget: "text", required: false }
          - { label: "Regeltext (wird 1:1 so angezeigt)", name: "content", widget: "text", hint: "Absätze mit einer Leerzeile trennen. Zeilen mit § werden als Regel-Karte dargestellt, kurze Zeilen mit Emoji als Überschrift." }

  - name: "ankuendigungen"
    label: "Ankündigungen"
    files:
      - file: "data-ankuendigungen.json"
        label: "Ankündigungen-Seite"
        name: "ankuendigungen"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - label: "Ankündigungen"
            name: "announcements"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Text", name: "text", widget: "text" }
