<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35c97a"/>
      <stop offset="100%" stop-color="#1f8a52"/>
    </linearGradient>
    <linearGradient id="pick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d78c"/>
      <stop offset="100%" stop-color="#e3b23c"/>
    </linearGradient>
  </defs>

  <circle cx="100" cy="100" r="96" fill="#12150f" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#2d3823" stroke-width="1.5"/>

  <!-- Block -->
  <g transform="translate(100,118)">
    <polygon points="0,-22 26,-9 0,4 -26,-9" fill="#35c97a"/>
    <polygon points="0,4 26,-9 26,13 0,26" fill="#1f8a52"/>
    <polygon points="0,4 -26,-9 -26,13 0,26" fill="#256e40"/>
  </g>

  <!-- Pickaxe -->
  <g transform="translate(100,92) rotate(-40)">
    <rect x="-4" y="-6" width="8" height="70" rx="3" fill="#8a5a34"/>
    <path d="M -46 -18 Q 0 -46 46 -18 Q 30 -6 0 -10 Q -30 -6 -46 -18 Z" fill="url(#pick)" stroke="#a9812f" stroke-width="2"/>
  </g>

  <text x="100" y="172" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="26" fill="#eef1e6" letter-spacing="1">CraftLegends</text>
</svg>
